version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # The engine is written against the TypeScript 5 compiler API; a major move is deliberate work.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Type definitions follow the Node version NextFix runs on (24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The demonstration application and the engine's test fixtures are vulnerable on purpose: their
  # pinned versions are what the walkthrough, the README validation table and the tests reason
  # about. No updates of any kind, for any ecosystem, in those folders.
  - package-ecosystem: npm
    directories:
      - /samples/express-shop
      - /packages/engine/test-fixtures/*
      - /packages/engine/test-fixtures/*/packages/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: pip
    directories:
      - /packages/engine/test-fixtures/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: gomod
    directories:
      - /packages/engine/test-fixtures/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
