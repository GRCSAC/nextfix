name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test "packages/engine/src/**/*.test.ts" "packages/server/src/**/*.test.ts"
      - run: npm run build
      - name: CLI usage and exit codes
        run: node packages/engine/src/cli.ts --help
      - name: Single executable builds and reports its version
        run: node packaging/build-sea.mjs
