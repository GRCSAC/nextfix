# Release on a version tag (v1.0.0, v1.1.0-rc.1): tests, typecheck and a scan of NextFix by
# itself gate everything; then the executables are built on every platform, the Docker image
# is pushed to GHCR and signed, and one GitHub release collects the binaries, SHA256SUMS, the
# image SBOM and the matching CHANGELOG.md section. The tag must equal the version in
# package.json (bump with `node scripts/set-version.mjs X.Y.Z`, then tag `vX.Y.Z`).
#
# Needs no secrets beyond GITHUB_TOKEN: packages: write pushes the image, id-token: write lets
# cosign sign it keyless through Sigstore, contents: write creates the release. The Windows
# installer job (code signing) is a placeholder; see its comment.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  check:
    name: Tests, typecheck, self-scan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The tag must match package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm run typecheck
      - run: node --test "packages/engine/src/**/*.test.ts" "packages/server/src/**/*.test.ts"
      - run: npm run build
      - name: Release notes exist for this version
        run: node packaging/release-notes.mjs "${{ steps.version.outputs.version }}" > /dev/null
      - name: NextFix scans itself (OSV, EPSS and KEV over the network)
        run: node packages/engine/src/cli.ts scan . --fail-on Act --no-derive --json nextfix-self-scan.json
      - uses: actions/upload-artifact@v7
        with:
          name: self-scan
          path: nextfix-self-scan.json

  executables:
    name: Executable (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Builds dist-bin/<platform>-<arch>/nextfix[.exe] from the running Node binary and checks
      # that it reports the package.json version. Unsigned on Windows; the installer job signs.
      - run: node packaging/build-sea.mjs
      - name: Smoke test
        shell: bash
        run: |
          exe="dist-bin/${{ matrix.target }}/nextfix"
          [ -f "$exe" ] || exe="$exe.exe"
          "$exe" --help
          "$exe" scan --help > /dev/null
          "$exe" serve --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: nextfix-${{ matrix.target }}
          path: dist-bin/${{ matrix.target }}/
          if-no-files-found: error

  docker:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextfix" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@v6
        env:
          # The build record artifact is not a release asset; keeping it out keeps the release job's downloads clean.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.check.outputs.version }}
            ${{ needs.check.outputs.prerelease == 'false' && format('{0}:latest', steps.name.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.title=NextFix
            org.opencontainers.image.description=Reachability- and exposure-aware vulnerability prioritization
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, Sigstore)
        run: cosign sign --yes "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}"
      - name: SBOM of the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: nextfix-${{ needs.check.outputs.version }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v7
        with:
          name: image-sbom
          path: nextfix-${{ needs.check.outputs.version }}-image.spdx.json

  # Placeholder for the signed Windows installer. packaging/windows holds the installer and
  # the signing script, built by their owner. When they are in: set `if: true`, take the
  # unsigned exe from the nextfix-win32-x64 artifact, sign it, build the installer, upload it
  # as an artifact named windows-installer, then add this job to the release job's `needs`
  # and copy its files into release/ in "Assemble release assets" so it ships with the release.
  windows-installer:
    name: Windows installer (placeholder)
    needs: executables
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nextfix-win32-x64
          path: dist-bin/win32-x64
      - run: echo "sign dist-bin/win32-x64/nextfix.exe and build the installer here"

  release:
    name: GitHub release
    needs: [check, executables, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: nextfix-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: image-sbom
          path: artifacts/image-sbom
      - uses: actions/download-artifact@v4
        with:
          name: self-scan
          path: artifacts/self-scan
      - name: Assemble release assets
        env:
          VERSION: ${{ needs.check.outputs.version }}
          IMAGE: ${{ needs.docker.outputs.image }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 win32-x64 darwin-arm64 darwin-x64; do
            dir="artifacts/nextfix-$target"
            [ -d "$dir" ] || { echo "missing executable for $target" >&2; exit 1; }
            if [ -f "$dir/nextfix.exe" ]; then
              cp "$dir/nextfix.exe" "release/nextfix-$VERSION-$target.exe"
            else
              cp "$dir/nextfix" "release/nextfix-$VERSION-$target"
              chmod 755 "release/nextfix-$VERSION-$target"
            fi
          done
          cp artifacts/image-sbom/*.spdx.json release/
          cp artifacts/self-scan/nextfix-self-scan.json "release/nextfix-$VERSION-self-scan.json"
          (cd release && sha256sum * > SHA256SUMS)
          node packaging/release-notes.mjs "$VERSION" > notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "Executables for Linux (x64, arm64), Windows (x64) and macOS (Apple silicon, Intel) are attached, with \`SHA256SUMS\`."
            echo "Docker image: \`$IMAGE:$VERSION\` (digest \`$DIGEST\`), signed with cosign; its SBOM is attached."
            echo "Install, upgrade and backup notes: docs/INSTALL.md."
          } >> notes.md
          ls -l release
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "NextFix $VERSION" --notes-file notes.md "${flags[@]}" release/*
